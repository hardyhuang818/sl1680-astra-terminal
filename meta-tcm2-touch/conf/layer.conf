# Layer configuration for meta-tcm2-touch — Synaptics TouchComm v2 TDDI
# (TD7800) integration for MACHINE=sl2619 / klamath family.

BBPATH .= ":${LAYERDIR}"

# Match recipes at both 3-level (recipes-cat/name/x.bb) and 4-level
# (recipes-cat/subcat/name/x.bb) depth — our synaptics-tcm2 recipe lives one
# directory deeper (recipes-kernel/linux-drivers/synaptics-tcm2/).
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend"

BBFILE_COLLECTIONS += "tcm2-touch"
BBFILE_PATTERN_tcm2-touch = "^${LAYERDIR}/"
BBFILE_PRIORITY_tcm2-touch = "10"

LAYERDEPENDS_tcm2-touch = "core meta-synaptics"
LAYERSERIES_COMPAT_tcm2-touch = "scarthgap"
